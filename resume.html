<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resume Builder | ResumeNova AI</title>

<link rel="stylesheet" href="resume.css">

</head>

<body>

<div class="container">

<h1>Create Your Resume</h1>

<form action="/resume" method="POST" enctype="multipart/form-data">
    <label>Profile Photo</label>
<input type="file" name="photo" accept="image/*">

<label>Full Name</label>
<input type="text" name="fullname" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone</label>
<input type="text" name="phone" required>

<label>Address</label>
<textarea name="address"></textarea>

<label>Career Objective</label>
<textarea id="objective" name="objective"></textarea>

<label>Skills</label>
<textarea id="skills" name="skills"></textarea>

<label>Education</label>
<textarea id="education" name="education"></textarea>

<label>Experience</label>
<textarea id="experience" name="experience"></textarea>

<label>Projects</label>
<textarea id="projects" name="projects"></textarea>


<button type="button" id="aiBtn">✨ AI Suggest</button>

<button type="submit">
Save Resume
</button>

</form>

</div>
<script src="resume.js"></script>
</body>



</html>
