<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATS Friendly Resume</title>

<link rel="stylesheet" href="template3.css">

</head>

<body>

<div class="resume">

    <div class="header">

        <img id="photo" src="" alt="Photo">

        <h1 id="fullname"></h1>

        <p id="email"></p>

        <p id="phone"></p>

    </div>

    <hr>

    <div class="section">

        <h2>Career Objective</h2>

        <p id="objective"></p>

    </div>

    <div class="section">

        <h2>Skills</h2>

        <pre id="skills"></pre>

    </div>

    <div class="section">

        <h2>Education</h2>

        <pre id="education"></pre>

    </div>

    <div class="section">

        <h2>Experience</h2>

        <pre id="experience"></pre>

    </div>

    <div class="section">

        <h2>Projects</h2>

        <pre id="projects"></pre>

    </div>

</div>

<script src="template3.js"></script>

</body>
</html>
