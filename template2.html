<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Resume</title>

<link rel="stylesheet" href="template2.css">

</head>
<body>

<div class="resume">

    <div class="left">

        <img id="photo" src="" alt="Photo">

        <h2 id="fullname"></h2>

        <hr>

        <h3>Contact</h3>

        <p id="email"></p>

        <p id="phone"></p>

        <h3>Skills</h3>

        <pre id="skills"></pre>

    </div>

    <div class="right">

        <h2>Career Objective</h2>

        <p id="objective"></p>

        <h2>Education</h2>

        <pre id="education"></pre>

        <h2>Experience</h2>

        <pre id="experience"></pre>

        <h2>Projects</h2>

        <pre id="projects"></pre>

    </div>

</div>

<script src="template2.js"></script>

</body>
</html>
