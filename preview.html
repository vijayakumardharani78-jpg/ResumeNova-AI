<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Preview | ResumeNova AI</title>

    <link rel="stylesheet" href="preview.css">

</head>

<body>

<div class="resume">

    <div class="header">

        <img id="photo"
             src=""
             alt="Profile Photo"
             style="width:130px;height:130px;border-radius:50%;object-fit:cover;display:none;">

        <h1 id="fullname"></h1>

        <p>
            <strong>Email:</strong>
            <span id="email"></span>
        </p>

        <p>
            <strong>Phone:</strong>
            <span id="phone"></span>
        </p>

    </div>

    <hr>

    <div class="section">

        <h2>Career Objective</h2>

        <p id="objective"></p>

    </div>

    <div class="section">

        <h2>Technical Skills</h2>

        <pre id="skills"></pre>

    </div>

    <div class="section">

        <h2>Education</h2>

        <pre id="education"></pre>

    </div>

    <div class="section">

        <h2>Experience</h2>

        <pre id="experience"></pre>

    </div>

    <div class="section">

        <h2>Projects</h2>

        <pre id="projects"></pre>
        <a href="/download-pdf">
        <button type="button">Download PDF</button>
    </a>


    </div>

</div>

<script src="preview.js"></script>


</body>
</html>
